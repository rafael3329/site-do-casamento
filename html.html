<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de presentes · R &amp; S · 03.07.2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#ffedae;--ink:#141108;--soft:#6a5f22;--card:#fff6cf;--line:#e2cf75;--petal:#fff3bd;--btn:#141108;--onbtn:#ffedae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1907;--ink:#ffedae;--soft:#cdbd74;--card:#2a2410;--line:#5e5420;--petal:#3a3213;--btn:#ffedae;--onbtn:#1d1907}}
:root[data-theme="dark"]{--bg:#1d1907;--ink:#ffedae;--soft:#cdbd74;--card:#2a2410;--line:#5e5420;--petal:#3a3213;--btn:#ffedae;--onbtn:#1d1907}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.6 Jost,system-ui,sans-serif;overflow-x:hidden}
.hero{position:relative;text-align:center;padding:64px 20px 40px;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mono{position:relative;font:400 clamp(130px,34vw,220px)/.85 "Bodoni Moda",serif;letter-spacing:-.06em;margin:0 0 0 -.06em}
.date{position:relative;letter-spacing:.42em;font-size:13px;font-weight:500;margin:26px 0 0}
.intro{position:relative;max-width:440px;margin:18px auto 0;color:var(--soft)}
.reveal{animation:rise 1.1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:10px}
nav button{font:inherit;font-weight:500;border:1px solid transparent;background:none;color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--btn);color:var(--onbtn)}
main{max-width:820px;margin:0 auto;padding:10px 18px 70px}
h2{font:italic 400 38px/1.1 "Bodoni Moda",serif;text-align:center;margin:48px 0 4px}
.sub{text-align:center;color:var(--soft);margin:0 0 22px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gift{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:18px 14px 14px;text-align:center;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;justify-content:center;transition:transform .2s,border-color .2s}
.gift:hover{transform:translateY(-3px);border-color:var(--ink)}
.gift:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.gift b{font-weight:500;font-size:16px;line-height:1.25}
.gift u{text-decoration:none;font-size:13px;color:var(--soft);margin-top:auto;letter-spacing:.04em}
dialog{border:1px solid var(--ink);border-radius:20px;background:var(--bg);color:var(--ink);max-width:420px;width:calc(100% - 28px);padding:28px 24px}
dialog::backdrop{background:rgba(20,17,8,.55)}
dialog h3{font:italic 400 30px/1.15 "Bodoni Moda",serif;margin:0 0 4px}
.x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:28px;color:var(--ink);cursor:pointer}
label{display:block;margin:16px 0 6px;font-weight:500;font-size:15px}
input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips button{font:inherit;border:1px solid var(--ink);border-radius:999px;background:none;color:var(--ink);padding:6px 16px;cursor:pointer}
.btn{display:block;width:100%;margin-top:16px;padding:13px;border-radius:12px;border:1px solid var(--btn);background:var(--btn);color:var(--onbtn);font:500 16px Jost,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.btn.alt{background:none;color:var(--ink)}
.key{word-break:break-all;background:var(--card);border:1px dashed var(--ink);border-radius:12px;padding:14px;margin-top:12px;font-weight:500;text-align:center}
.hidden{display:none}
footer{text-align:center;padding:10px 20px 50px;color:var(--soft)}
</style>
</head>
<body>
<header class="hero">
  <h1 class="mono reveal">RS</h1>
  <p class="date reveal">03.07.2027</p>
  <p class="intro reveal">Escolha um presente e envie o valor que quiser por Pix. Ele chega direto na conta dos noivos.</p>
</header>

<nav id="abas" aria-label="Categorias"></nav>
<main id="lista"></main>
<footer>Obrigado por fazer parte da nossa história.</footer>

<dialog id="dlg">
  <button class="x" id="fechar" aria-label="Fechar">×</button>
  <div id="passo1">
    <h3 id="nomePresente"></h3>
    <label for="nome">Seu nome</label><input id="nome" autocomplete="name">
    <label for="valor">Valor do presente (R$)</label><input id="valor" inputmode="decimal" placeholder="Ex.: 100">
    <div class="chips" id="chips"></div>
    <button class="btn" id="seguir">Ver chave Pix</button>
  </div>
  <div id="passo2" class="hidden">
    <h3>Pagar com Pix</h3>
    <p id="resumo"></p>
    <div class="key" id="chave"></div>
    <button class="btn" id="copiar">Copiar chave Pix</button>
    <a id="zap" class="btn alt" target="_blank" rel="noopener">Avisar os noivos no WhatsApp</a>
  </div>
</dialog>

<script>
// ===== EDITE AQUI =====
const CONFIG = {
  pixChave: "54135987850",   // CPF, e-mail, telefone ou chave aleatória
  pixNome: "Nome do titular",
  whatsapp: "5513996710990"         // 55 + DDD, só números
};
const LISTA = {
  "Cozinha": {sub:"Para as nossas manhãs e jantares", itens:[["🧊","Geladeira"],["🔥","Fogão"],["📡","Micro-ondas"],["🍲","Jogo de panela"],["🍽️","Jogo de prato"],["🍴","Jogo de talheres"],["🍰","Jogo de sobremesa"],["🥛","Jogo de copo"],["☕","Jogo de xícaras"],["🍷","Jogo de taça"],["🥘","Jogo de travessa"],["🔪","Jogo de faca"],["🥤","Liquidificador"],["🍟","Air Fryer"],["🧺","Jogo de pano de prato"],["🥪","Sanduicheira"],["🍛","Panela elétrica"],["🧁","Batedeira"],["🌀","Mixer"],["🫧","Máquina de lavar"]]},
  "Sala": {sub:"Para receber quem a gente ama", itens:[["🪑","Mesa e cadeiras"],["🛋️","Sofá"],["📺","Televisão"],["🗄️","Rack de TV"],["🪟","Cortina blecaute"]]},
  "Quarto": {sub:"Para descansar juntos", itens:[["🛏️","Cama"],["👔","Quadro de roupa"],["🪟","Cortina"],["🛌","Jogo de cama"],["🛁","Jogo de toalhas de banho e rosto"]]}
};
// =======================
const $ = id => document.getElementById(id), dlg = $("dlg");
let atual = "";
const abas = $("abas");
Object.entries(LISTA).forEach(([cat, d], i) => {
  const sec = document.createElement("section"); sec.id = "s" + i;
  sec.innerHTML = `<h2>${cat}</h2><p class="sub">${d.sub}</p>`;
  const g = document.createElement("div"); g.className = "grid";
  d.itens.forEach(([ic, nome]) => {
    const b = document.createElement("button"); b.className = "gift";
    b.innerHTML = `<b>${nome}</b><u>Presentear</u>`;
    b.onclick = () => abrir(nome); g.appendChild(b);
  });
  sec.appendChild(g); $("lista").appendChild(sec);
  const a = document.createElement("button"); a.textContent = cat;
  a.setAttribute("aria-pressed", i === 0);
  a.onclick = () => { document.getElementById("s" + i).scrollIntoView(); };
  abas.appendChild(a);
});
const secs = [...document.querySelectorAll("main section")];
addEventListener("scroll", () => {
  let k = 0; secs.forEach((s, i) => { if (s.getBoundingClientRect().top < 140) k = i; });
  [...abas.children].forEach((a, i) => a.setAttribute("aria-pressed", i === k));
}, {passive:true});
[50,100,200,500].forEach(v => { const c = document.createElement("button"); c.textContent = "R$ " + v; c.onclick = () => $("valor").value = v; $("chips").appendChild(c); });
function abrir(n){ atual = n; $("nomePresente").textContent = n; $("passo1").classList.remove("hidden"); $("passo2").classList.add("hidden"); $("copiar").textContent = "Copiar chave Pix"; dlg.showModal(); }
$("fechar").onclick = () => dlg.close();
$("seguir").onclick = () => {
  const nome = $("nome").value.trim(), valor = parseFloat($("valor").value.replace(",", "."));
  if (!nome) return $("nome").focus();
  if (!(valor > 0)) return $("valor").focus();
  const v = valor.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
  $("resumo").textContent = `${nome}, envie ${v} para ${CONFIG.pixNome} pelo Pix. Presente: ${atual}.`;
  $("chave").textContent = CONFIG.pixChave;
  $("zap").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(`Oi! Sou ${nome} e enviei ${v} por Pix para o presente: ${atual}.`);
  $("passo1").classList.add("hidden"); $("passo2").classList.remove("hidden");
};
$("copiar").onclick = async () => {
  try { await navigator.clipboard.writeText(CONFIG.pixChave); $("copiar").textContent = "Chave copiada"; }
  catch(e){ $("copiar").textContent = "Selecione a chave acima e copie"; }
};
</script>
</body>
</html>
